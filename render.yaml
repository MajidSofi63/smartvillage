services:
  - type: web
    name: smart-village
    runtime: python
    # The FastAPI app lives in backend/ and serves frontend/ from the repo root.
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # scikit-learn 1.5.2 does not support Python 3.13+.
      - key: PYTHON_VERSION
        value: 3.12.10
      # Set these values in the Render dashboard. sync: false keeps secrets
      # out of this file.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_ENABLED
        value: "true"
      - key: WEATHER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
